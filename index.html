<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cyber-Plex Concierge</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d0221" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap');

      body {
        background-color: #0d0221;
        background-image:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
          linear-gradient(90deg, rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
          url('data:image/svg+xml;utf8,<svg width="100" height="100" transform="scale(1)" opacity="0.05" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="p" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0 L0 0 L0 100" fill="none" stroke="%2326c4ff" stroke-width="1"></path></pattern></defs><rect width="100%" height="100%" fill="url(%23p)"></rect></svg>');
        background-size: 4px 4px, 4px 4px, 100px 100px;
        font-family: 'VT323', monospace;
        color: #e0e0e0;
        overflow: hidden;
      }

      body::after {
          content: "";
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
          background-size: 100% 2px, 3px 100%;
          pointer-events: none;
          z-index: 999;
      }

      .font-brand { font-family: 'Press Start 2P', cursive; }
      
      .neon-text-cyan { color: #26c4ff; text-shadow: 0 0 3px #26c4ff, 0 0 5px #26c4ff; }
      .neon-text-pink { color: #ff00de; text-shadow: 0 0 3px #ff00de, 0 0 5px #ff00de; }
      .neon-text-yellow { color: #fde68a; text-shadow: 0 0 3px #fde68a, 0 0 5px #fde68a; }
      .neon-text-green { color: #39ff14; text-shadow: 0 0 3px #39ff14, 0 0 5px #39ff14; }
      .neon-text-red { color: #ff3333; text-shadow: 0 0 3px #ff3333, 0 0 5px #ff3333; }
      .neon-text-purple { color: #9f50ff; text-shadow: 0 0 3px #9f50ff, 0 0 5px #9f50ff; }

      .y2k-panel {
        background-color: rgba(13, 2, 33, 0.8);
        backdrop-filter: blur(4px);
        border-width: 2px;
        border-style: solid;
        border-radius: 4px;
      }

      .neon-border-cyan { border-color: #26c4ff; box-shadow: 0 0 8px #26c4ff; }
      .neon-border-pink { border-color: #ff00de; box-shadow: 0 0 8px #ff00de; }
      .neon-border-green { border-color: #39ff14; box-shadow: 0 0 8px #39ff14; }
      .neon-border-yellow { border-color: #fde68a; box-shadow: 0 0 8px #fde68a; }
      .neon-border-red { border-color: #ff3333; box-shadow: 0 0 8px #ff3333; }
      .neon-border-purple { border-color: #9f50ff; box-shadow: 0 0 8px #9f50ff; }
      
      .y2k-button {
        font-family: 'Press Start 2P', cursive;
        background-color: #0d0221;
        border: 2px solid #26c4ff;
        color: #26c4ff;
        padding: 0.5rem 1rem;
        text-transform: uppercase;
        font-size: 0.8rem;
        transition: all 0.1s;
        box-shadow: 0 0 4px #26c4ff;
      }
      .y2k-button:hover { background-color: #26c4ff; color: #0d0221; box-shadow: 0 0 15px #26c4ff; transform: scale(1.05); }
      .y2k-button.green { border-color: #39ff14; color: #39ff14; box-shadow: 0 0 4px #39ff14; }
      .y2k-button.green:hover { background-color: #39ff14; }
      .y2k-button.yellow { border-color: #fde68a; color: #fde68a; box-shadow: 0 0 4px #fde68a; }
      .y2k-button.yellow:hover { background-color: #fde68a; }

      .floor-grid {
        background-image: 
            linear-gradient(to right, rgba(38, 196, 255, 0.1) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(38, 196, 255, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        perspective: 500px;
        transform: rotateX(60deg) translateY(-20%);
        height: 150%;
      }

      .carpet-runner {
        background: linear-gradient(to right, #450a0a, #7f1d1d, #450a0a);
        border-left: 4px solid #39ff14;
        border-right: 4px solid #39ff14;
        box-shadow: 0 0 15px #39ff14;
      }

      @keyframes screen-glitch {
          0% { filter: none; transform: translate(0); }
          5% { filter: hue-rotate(90deg); transform: translate(2px, -2px); }
          10% { filter: invert(0.1); transform: translate(-2px, 2px); }
          15% { filter: none; transform: translate(0); }
      }
      .crash-flash { animation: screen-glitch 0.1s infinite; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.1",
    "react/": "https://esm.sh/react@^19.1.1/",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "@google/genai": "https://esm.sh/@google/genai@^1.11.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
